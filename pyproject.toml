[project]
name = "luxury-concierge-agent"
version = "0.1.0"
description = "Agentic AI concierge for bespoke luxury vehicle configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.23",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
    "langgraph>=0.2.60",
    "openai>=1.58.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.41.1",
    "typer>=0.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[project.scripts]
lca-eval = "lca.evals.runner:main"
lca-ingest = "lca.rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lca"]

[tool.ruff]
line-length = 100
target-version = "py311"
